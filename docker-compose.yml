# Local copy of the whole app: Next.js (web) + NestJS (api) + Postgres (db) + S3-compatible file
# storage, as on the server. See docs/DOCKER.md.
name: kachabity

services:
  # web and api share this container's network, which forwards localhost:9000 to the file storage:
  # file URLs and signed links then work the same in the browser, the web container's image
  # optimizer and the api.
  gateway:
    image: alpine/socat:1.8.0.3
    command: tcp-listen:9000,fork,reuseaddr tcp-connect:storage:9000
    ports: ["3000:3000", "4000:4000"]

  web:
    build:
      context: .
      network: host # the build prerenders pages from the api (localhost:4000)
      secrets: [env]
    env_file: .env.docker
    network_mode: service:gateway
    depends_on: [gateway, api]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env.docker
    # Same network as web: localhost:3000 (web) and :9000 (files) mean the same here and in the
    # browser, so signed file links work as they are.
    network_mode: service:gateway
    depends_on: [gateway, db, storage, colissimo]
    environment:
      NEXT_URL: http://localhost:3000
      # The Colissimo stand-in below, never the real account (its tokens are test values).
      COLISSIMO_API_URL: http://colissimo:9100/api/v1
      COLISSIMO_API_V2_URL: http://colissimo:9100/apis-v2
      COLISSIMO_ADD_TOKEN: local-colissimo-token
      COLISSIMO_TRACKING_TOKEN: local-colissimo-state-token

  # Stands in for Colissimo's APIs (scripts/docker/colissimo-mock.mjs); tests drive it on :9100.
  colissimo:
    image: node:22-alpine
    command: node /mock.mjs
    volumes: ["./scripts/docker/colissimo-mock.mjs:/mock.mjs:ro"]
    ports: ["9100:9100"]

  # Plain Postgres 17, as on the server (phase 5). Local-only credentials.
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: kachabity
      POSTGRES_PASSWORD: kachabity-local
      POSTGRES_DB: kachabity
    ports: ["5433:5432"]
    volumes: [db:/var/lib/postgresql/data]

  # S3-compatible file storage standing in for Cloudflare R2 (buckets products and documents).
  # Local-only credentials, the same as in .env.docker.
  storage:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64
    configs: [{ source: s3, target: /etc/seaweedfs/s3.json }]
    ports: ["9000:9000"]
    volumes: [storage:/data]

  storage-buckets:
    image: chrislusf/seaweedfs:3.80
    depends_on: [storage]
    entrypoint: ["sh", "-c"]
    # The filer starts a while after the master: retry until both buckets are listed (2 minutes max).
    command:
      - |
        shell() { echo "$$1" | weed shell -master=storage:9333 -filer=storage:8888 2>&1; }
        for i in $$(seq 40); do
          shell 's3.bucket.create -name products' >/dev/null
          shell 's3.bucket.create -name documents' >/dev/null
          list=$$(shell 's3.bucket.list')
          if echo "$$list" | grep -q products && echo "$$list" | grep -q documents; then echo 'Buckets ready: products, documents'; exit 0; fi
          sleep 3
        done
        echo 'The file storage did not start'; exit 1
    restart: "no"

secrets:
  env:
    file: .env.docker

configs:
  s3:
    content: |
      {"identities": [
        {"name": "kachabity", "credentials": [{"accessKey": "kachabity-local", "secretKey": "kachabity-local-secret"}],
         "actions": ["Admin", "Read", "Write", "List", "Tagging"]},
        {"name": "anonymous", "actions": ["Read:products"]}
      ]}

volumes:
  db:
  storage:
