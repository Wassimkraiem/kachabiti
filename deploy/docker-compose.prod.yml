# The production API server (docs/DEPLOY.md): Postgres, the NestJS API, and Caddy in front on
# ports 80/443 (HTTPS certificates from Let's Encrypt, renewed by itself). The site is on Vercel,
# which forwards /api to https://<SITE_DOMAIN>.
# Lives in /opt/kachabity on the server with its .env; deploy.sh sets API_IMAGE.
name: kachabity

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [db:/var/lib/postgresql/data]
    # The server's loopback only: reach it through an SSH tunnel (pgAdmin, the data move), never the internet.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 6

  api:
    # deploy.sh sets API_IMAGE; other commands (ps, logs, backups) use the image it tagged as current.
    image: ${API_IMAGE:-kachabity-api:current}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      PORT: "4000"
      # POSTGRES_PASSWORD must be URL-safe (letters and digits), see .env.example.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"ok\"'"]
      interval: 15s
      retries: 4
      start_period: 20s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

configs:
  # shortcut: trusts X-Forwarded-For from anyone, so the API's per-IP limits see the shopper's address
  # behind Vercel (whose IPs aren't fixed); a direct caller can fake it, but per-e-mail limits still
  # hold. Restrict it if Vercel ever publishes stable egress IPs.
  caddyfile:
    content: |
      {
        servers {
          trusted_proxies static 0.0.0.0/0 ::/0
        }
      }
      ${SITE_DOMAIN} {
        encode zstd gzip
        # Every running API container (two during a deploy, see deploy.sh), looked up each second;
        # a request that can't connect to one is retried on another for up to 10 seconds.
        reverse_proxy {
          dynamic a {
            name api
            port 4000
            refresh 1s
          }
          lb_try_duration 10s
        }
      }

volumes:
  db:
  caddy_data:
  caddy_config:
